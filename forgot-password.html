<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - DankakaData</title>

    <link rel="stylesheet" href="forgot-password.css">

   <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <img src="logo.png" class="auth-logo" alt="DankakaData">

        <h2>Forgot Password?</h2>

        <p class="auth-subtitle">
            Please enter email address or phone number associated with your account
            and we will send you a link to reset your password.
        </p>

        <!-- Account -->

        
        <div class="inputBox passwordBox">
            <input
                type="text"
                id="account" required>

            <label> Email or Phone Number</label>
        </div>

        <button
            type="button"
            class="register-btn"
            onclick="verifyAccount()"
        >
            Continue
        </button>

        <p id="message"></p>

        <!-- Reset Password -->
        <div id="resetSection" style="display:none;">


            <div class="inputBox passwordBox">

<input
type="password"
id="newPassword"
required>

<label> New Password</label>

<span class="toggle" id="togglePassword">

<i class="fa-solid fa-eye"></i>

</span>

<small class="error"></small>

</div>

<div class="inputBox passwordBox">

<input
type="password"
id="confirmPassword"
required>

<label>Confirm Password</label>

<span class="toggle" id="toggleConfirm">

<i class="fa-solid fa-eye"></i>

</span>

<small class="error"></small>

</div>

            <!-- <div class="input-box">
                <input
                    type="password"
                    id="newPassword"
                    placeholder="New Password"
                >
            </div>

            <div class="input-box">
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm New Password"
                >
            </div> -->

            <button
                type="button"
                class="register-btn"
                onclick="resetPassword()"
            >
                Reset Password
            </button>

        </div>

        <p class="back-login">
            Remember your password?
            <a href="login.html">Login</a>
        </p>

    </div>

</div>

<script src="forgot-password.js"></script>

</body>
</html>
